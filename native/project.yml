name: DSBot
options:
  bundleIdPrefix: io.github.fei2411
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  DSBot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/DSBot
      - path: Sources/Transport
      - path: Resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: DS Bot
        NSCameraUsageDescription: DS Bot uses the camera to scan the pairing code shown on your computer.
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # A silent push wakes the app through UIBackgroundModes; without the mode the
        # push token still registers, but a notification never launches anything. And
        # iOS hands a URL to openURLContexts only if its scheme is registered here -
        # without CFBundleURLTypes the dsbot: deep link is dead code on the device.
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: io.github.fei2411.dsbot
            CFBundleURLSchemes:
              - dsbot
        # The phone talks to the Relay over ws:// - to 127.0.0.1 in the simulator, and to
        # the computer's LAN address when a real phone pairs by QR code. ATS blocks
        # cleartext by default, which shows up as an app that connects to nothing at all.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fei2411.dsbot.native
        PRODUCT_NAME: DSBot
        TARGETED_DEVICE_FAMILY: "1,2"
    # The resigning host reads the entitlements from this file: with
    # CODE_SIGNING_ALLOWED=NO nothing is embedded into the binary (expected in an
    # unsigned package), so the file itself is the carrier for aps-environment.
    # "development" is the template value; the enterprise profile decides the real
    # one at resign time.
    entitlements:
      path: Support/DSBot.entitlements
  DSBotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/TransportTests
    dependencies:
      - target: DSBot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fei2411.dsbot.native.tests
  # End-to-end interop: the transport compiles for macOS too, so the matching
  # workflow can run it on a runner without a simulator.
  InteropTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/Transport
      - path: Tests/InteropTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fei2411.dsbot.native.interop
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
schemes:
  DSBot:
    build:
      targets:
        DSBot: all
        DSBotTests: [test]
    test:
      targets:
        - DSBotTests
    run:
      config: Debug
  Interop:
    build:
      targets:
        InteropTests: [test]
    test:
      targets:
        - InteropTests

name: iOS native smoke

# Compiling proves nothing about launching: a scene manifest that names a missing class, a
# broken constraint or a MainActor initialisation racing the first frame all compile clean
# and then render black or crash. This boots the app, waits, and fails on either.
#
# It runs on every push that touches the UIKit side. Transport changes stay out: that layer
# has unit tests and the interop job, and it cannot black-screen the app on its own.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner
        default: macos-26
        type: choice
        options: [macos-26, macos-15]
      xcode_version:
        description: Xcode version to select, e.g. 26.6
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      # project.yml is in the list because the generated Info.plist (scene manifest,
      # orientations) lives there: a wrong class name there fails at launch, not at build.
      - 'native/Sources/DSBot/**'
      - 'native/project.yml'

permissions:
  contents: read

concurrency:
  group: ios-native-smoke-${{ github.ref }}
  # A newer push makes an older smoke run pointless.
  cancel-in-progress: true

jobs:
  smoke:
    name: Launch it and look at the first screen
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check the native project exists
        run: |
          if [ ! -f native/project.yml ]; then
            echo "::error::native/project.yml is missing; there is nothing to build."
            exit 1
          fi
          if [ -z "$(find native/Sources/DSBot -name '*.swift' -print -quit 2>/dev/null)" ]; then
            echo "::error::native/Sources/DSBot holds no Swift files; the app target has no sources."
            exit 1
          fi
          echo "app sources: $(find native/Sources/DSBot -name '*.swift' | wc -l | tr -d ' ') files"

      - name: Select Xcode
        env:
          WANTED: ${{ inputs.xcode_version }}
        run: |
          if [ -n "$WANTED" ]; then
            selected="/Applications/Xcode_$WANTED.app"
            if [ ! -d "$selected" ]; then
              echo "::error::$selected is not on this image. Available:"
              ls -d /Applications/Xcode*.app
              exit 1
            fi
          else
            selected="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V 2>/dev/null | tail -1)"
            if [ -z "$selected" ]; then
              selected="$(ls -d /Applications/Xcode*.app 2>/dev/null | tail -1)"
            fi
          fi
          if [ -z "$selected" ]; then
            echo "::error::no Xcode found on this image"
            exit 1
          fi
          sudo xcode-select -s "$selected"
          xcodebuild -version
          major="$(xcodebuild -version | awk '/^Xcode /{split($2,p,"."); print p[1]}')"
          if [ "${major:-0}" -lt 26 ]; then
            echo "::error::Xcode $major has no iOS 26 SDK"
            exit 1
          fi

      - name: Generate the Xcode project
        id: generate
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          cd native
          xcodegen generate
          project_file="$(ls -d *.xcodeproj 2>/dev/null | head -1)"
          if [ -z "$project_file" ]; then
            echo "::error::xcodegen produced no .xcodeproj in native/"
            exit 1
          fi
          echo "project=native/$project_file" >> "$GITHUB_OUTPUT"
          echo "generated $project_file"

      - name: Read the scheme
        id: scheme
        run: |
          project_file="${{ steps.generate.outputs.project }}"
          listed="$(xcodebuild -list -json -project "$project_file")"
          scheme="$(printf '%s' "$listed" | python3 -c '
          import json, sys
          listed = json.load(sys.stdin)
          container = listed.get("project") or listed.get("workspace") or {}
          names = [name for name in (container.get("schemes") or []) if not name.startswith("Pods")]
          wanted = sys.argv[1]
          print(wanted if wanted in names else (names[0] if names else ""))
          ' "$(basename "$project_file" .xcodeproj)")"
          if [ -z "$scheme" ]; then
            echo "::error::no app scheme to build. Schemes: $listed"
            exit 1
          fi
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "app scheme: $scheme"

      - name: Boot a simulator
        id: sim
        run: |
          listing="$(xcrun simctl list devices available || true)"
          line="$(printf '%s\n' "$listing" | grep -m1 'iPhone' || true)"
          udid="$(printf '%s' "$line" | sed -nE 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/p')"
          name="$(printf '%s' "$line" | sed -nE 's/^[[:space:]]*([^(]*)\(.*/\1/p' | sed -E 's/[[:space:]]+$//')"
          if [ -z "$udid" ]; then
            echo "::error::no iPhone simulator on this image; the smoke needs one"
            printf '%s\n' "$listing" | head -40
            exit 1
          fi
          echo "simulator: $name ($udid)"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "DSBOT_UDID=$udid" >> "$GITHUB_ENV"

      # No signing flags: a simulator build signs itself ad hoc, and an unsigned bundle can
      # make simctl install refuse it on some runtimes.
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p smoke
          xcodebuild build \
            -project "${{ steps.generate.outputs.project }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DSBOT_UDID" \
            -derivedDataPath build \
            2>&1 | tee smoke/build.log
          app="$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$app" ]; then
            echo "::error::the build produced no .app for the simulator"
            tail -40 smoke/build.log || true
            exit 1
          fi
          echo "DSBOT_APP=$app" >> "$GITHUB_ENV"
          echo "built $app"

      - name: Install and launch
        run: |
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$DSBOT_APP/Info.plist")"
          if [ -z "$bundle_id" ]; then
            echo "::error::the app has no CFBundleIdentifier"
            exit 1
          fi
          echo "DSBOT_BUNDLE_ID=$bundle_id" >> "$GITHUB_ENV"
          xcrun simctl install "$DSBOT_UDID" "$DSBOT_APP"
          echo "installed $bundle_id"
          xcrun simctl terminate "$DSBOT_UDID" "$bundle_id" >/dev/null 2>&1 || true
          xcrun simctl launch "$DSBOT_UDID" "$bundle_id" | tee smoke/launch.log
          # First frame, first layout pass, first autolayout warnings.
          sleep 8
          pid="$(sed -nE 's/.*: ([0-9]+)$/\1/p' smoke/launch.log | tail -1)"
          if [ -n "$pid" ] && ps -p "$pid" >/dev/null 2>&1; then
            echo "still running after 8s (pid $pid)"
          elif xcrun simctl spawn "$DSBOT_UDID" launchctl list | grep -q "$bundle_id"; then
            echo "still running after 8s (launchd job present)"
          else
            echo "::error::the app exited within 8s of launch, which reads as a crash on start"
            xcrun simctl spawn "$DSBOT_UDID" log show --last 2m --style compact \
              --predicate 'process == "DSBot"' > smoke/device.log 2>&1 || true
            tail -60 smoke/device.log || true
            exit 1
          fi

      # A screenshot for people, and a BMP for the check below: sips converts without a
      # dependency, and BMP rows are trivial to read without an image library.
      - name: Screenshot the first screen
        run: |
          xcrun simctl io "$DSBOT_UDID" screenshot smoke/01-launch.png
          # Two routes to BMP, because the check needs pixels and either route can be absent
          # on an image: simctl writes one directly, sips converts if it does not.
          xcrun simctl io "$DSBOT_UDID" screenshot --type=bmp smoke/01-launch.bmp 2>/dev/null || true
          if [ ! -f smoke/01-launch.bmp ] || [ "$(head -c 2 smoke/01-launch.bmp)" != "BM" ]; then
            sips -s format bmp smoke/01-launch.png --out smoke/01-launch.bmp >/dev/null
          fi
          if [ "$(head -c 2 smoke/01-launch.bmp)" != "BM" ]; then
            echo "::error::neither simctl nor sips produced a BMP from the screenshot"
            exit 1
          fi
          ls -l smoke/01-launch.png smoke/01-launch.bmp

      # A live process proves nothing about what it draws: a black screen is the failure mode
      # this project keeps hitting, and it keeps the process alive. Sample the centre of the
      # first screen; if every sample is the same colour, the app rendered nothing.
      - name: Check the first screen is not a solid colour
        run: |
          python3 - smoke/01-launch.bmp <<'PY'
          import struct, sys

          path = sys.argv[1]
          raw = open(path, "rb").read()
          if raw[:2] != b"BM":
              print("::error::the screenshot is not a BMP: " + raw[:2].hex())
              sys.exit(1)
          offset, = struct.unpack_from("<I", raw, 10)
          width, height = struct.unpack_from("<ii", raw, 18)
          bpp, = struct.unpack_from("<H", raw, 28)
          top_down = height < 0
          height = abs(height)
          if width <= 0 or height <= 0 or bpp not in (24, 32):
              print("::error::unexpected BMP shape: " + str(width) + "x" + str(height) + " at " + str(bpp) + "bpp")
              sys.exit(1)
          stride = ((bpp * width + 31) // 32) * 4
          step = bpp // 8

          def pixel(x, y):
              row = y if top_down else height - 1 - y
              at = offset + row * stride + x * step
              return (raw[at + 2], raw[at + 1], raw[at])

          # The centre 40%: the empty state, the title and the composer all cross it.
          x0, x1 = int(width * 0.3), int(width * 0.7)
          y0, y1 = int(height * 0.3), int(height * 0.7)
          xs = list(range(x0, x1, max(1, (x1 - x0) // 9)))[:10]
          ys = list(range(y0, y1, max(1, (y1 - y0) // 9)))[:10]
          points = [(x, y) for y in ys for x in xs]
          colours = [pixel(x, y) for x, y in points]
          distinct = sorted(set(colours))
          print("screenshot " + str(width) + "x" + str(height) + " at " + str(bpp) + "bpp")
          print("sampled " + str(len(points)) + " points over the centre -> " + str(len(distinct)) + " distinct colour(s)")
          print("first few: " + ", ".join(str(c) for c in distinct[:5]))
          if len(distinct) == 1:
              print("::error::the first screen is one colour rgb" + str(distinct[0]) + " over the whole centre: the app rendered nothing")
              sys.exit(1)
          print("first screen is not a solid colour")
          PY

      - name: Collect the app log
        if: failure()
        run: |
          xcrun simctl spawn "$DSBOT_UDID" log show --last 5m --style compact \
            --predicate 'process == "DSBot" OR subsystem CONTAINS "dsbot"' > smoke/device.log 2>&1 || true
          tail -80 smoke/device.log || true

      - name: Shut the simulator down
        if: always()
        run: xcrun simctl shutdown "$DSBOT_UDID" >/dev/null 2>&1 || true

      # The picture is cheap and is the whole point of the run, so it is kept either way:
      # a green run still needs its proof that something was drawn.
      - name: Keep the first screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-smoke-screen
          path: smoke/01-launch.png
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Keep the logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-smoke-log
          path: |
            smoke/build.log
            smoke/launch.log
            smoke/device.log
          if-no-files-found: warn
          retention-days: 7
